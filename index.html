        /* Animation */
        const { useState, useEffect, useRef } = React;
        const useCountUp = (target, duration = 1800, start = false) => {
        const [count, setCount] = useState(0);
            useEffect(() => {
                if (!start) return;
                let startTime = null;
                const step = (timestamp) => {
                    if (!startTime) startTime = timestamp;
                    const progress = Math.min((timestamp - startTime) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    setCount(Math.floor(ease * target));
                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }, [start, target, duration]);
            return count;
        };

        /* Generic scroll-reveal hook: returns [ref, isVisible] */
        const useReveal = (threshold = 0.15) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setVisible(true);
                            observer.disconnect();
                        }
                    },
                    { threshold, rootMargin: '0px 0px -60px 0px' }
                );
                observer.observe(el);
                return () => observer.disconnect();
            }, [threshold]);
            return [ref, visible];
        };

        /* Wrapper component: applies a reveal class + optional stagger delay when scrolled into view */
        const Reveal = ({ children, className = '', variant = 'reveal', delay = 0, as = 'div', ...rest }) => {
            const [ref, visible] = useReveal();
            const Tag = as;
            return (
                <Tag
                    ref={ref}
                    className={`${variant} ${visible ? 'reveal-in' : ''} ${className}`}
                    style={{ '--reveal-delay': `${delay}ms` }}
                    {...rest}
                >
                    {children}
                </Tag>
            );
        };

        /* Looping background video with graceful fallback (no file = nothing breaks) */
        const BgVideo = ({ src, webmSrc, opacityClass = 'opacity-20' }) => {
            const [failed, setFailed] = useState(false);
            if (failed) return null;
            return (
                <div className={`bg-video-wrap ${opacityClass}`} aria-hidden="true">
                    <video
                        autoPlay
                        muted
                        loop
                        playsInline
                        onError={() => setFailed(true)}
                    >
                        {webmSrc && <source src={webmSrc} type="video/webm" />}
                        <source src={src} type="video/mp4" />
                    </video>
                </div>
            );
        };

        /* Sequence-based background using the JPG frames uploaded in video1/video2.
           This now reacts to scroll position so it behaves like a main background layer. */
        const BgImageSequence = ({
            folder,

            opacityClass = 'opacity-20',

            parallax = 0.12,
            overlayOpacity = 0.92,

                const handleScroll = () => setScrollY(window.scrollY || window.pageYOffset || 0);
                handleScroll();
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);

                Math.max(0, Math.floor(scrollY / scrollFactor) % Math.max(frameCount, 1))
            );

            return (

                            transform: `scale(${scale})`,
                            zIndex: 0
                        }}

            );

    <script>
        // Compile the JSX block with Babel using classic runtime, then execute.
        (function(){
            try {
                const src = document.getElementById('app-jsx').textContent;
                const out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
                // eslint-disable-next-line no-eval
                eval(out);
            } catch (e) {
                console.error('JSX compile error', e);
            }
        })();
    </script>
